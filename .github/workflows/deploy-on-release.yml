name: Deploy Website on Release

on:
  repository_dispatch:
    types: [electerm-release]

  push:
    branches: [ master ]

  workflow_dispatch:

jobs:

  check-skip-ci:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - id: check
        name: Check if [skip ci] is in commit message
        run: |
          if echo "${{ github.event.head_commit.message || '' }}" | grep -i '\[skip ci\]'; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: check-skip-ci
    if: needs.check-skip-ci.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Fetch base release data (on electerm-release dispatch)
        if: github.event_name == 'repository_dispatch'
        run: npm run down
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest release data (on electerm-release dispatch)
        if: github.event_name == 'repository_dispatch'
        run: node bin/fetch-release-json.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch android release data (on electerm-release dispatch)
        if: github.event_name == 'repository_dispatch'
        run: node bin/fetch-android.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit latest release data (on electerm-release dispatch)
        if: github.event_name == 'repository_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/release-data src/release-data-android
          if git diff --cached --quiet; then
            echo "No new release data to commit"
          else
            git commit -m "chore: add latest release data [skip ci]"
            git push
          fi

      - name: Build site
        run: npm run b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
