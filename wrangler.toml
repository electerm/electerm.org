# Cloudflare Worker config for electerm.org
#
# The site is fully static (built into public/ by `npm run b`).
# Static assets are served by the Workers asset runtime:
#   - security + CORS headers are set in src/worker.js (NOT _headers: the
#     asset runtime drops _headers under run_worker_first, and the build glob
#     excluded dotfiles so _headers never deployed anyway)
#   - locale redirects come from src/static/_redirects (copied to public/ by
#     `npm run cp`, which uses `cp -r src/static/.` to include dotfiles)
#   - unknown paths serve public/404.html with a 404 status (not_found_handling)
# Only /api/* requests invoke the worker (src/worker.js).
#
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "electerm-org"
main = "src/worker.js"
compatibility_date = "2026-06-30"

[assets]
# Static site generated by `npm run b`
directory = "./public"
# Lets the worker fall back to assets for unmatched /api/* paths
binding = "ASSETS"
# Serve 404.html with a 404 status for unknown paths (replaces Vercel's rewrite to /api/404)
not_found_handling = "404-page"
# Worker runs first for every request (needed for the legacy-domain redirect),
# non-/api/* requests fall through to assets
run_worker_first = true

[observability]
enabled = true
