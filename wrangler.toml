# Cloudflare Worker config for electerm.org
#
# The site is fully static (built into public/ by `npm run b`).
# Static assets are served directly by the Workers asset runtime, which applies
# src/static/_headers (security + CORS) to every asset response.
#
# IMPORTANT: run_worker_first MUST be false. With run_worker_first = true the
# Worker fronts asset requests and Cloudflare strips BOTH _headers rules AND any
# headers the worker adds to env.ASSETS.fetch() responses (cache HIT serves the
# raw asset). run_worker_first = false lets the asset runtime apply _headers.
#
#   - locale redirects come from src/static/_redirects
#   - security + CORS headers come from src/static/_headers
#   - unknown paths serve public/404.html with a 404 status (not_found_handling)
# This worker (src/worker.js) only handles non-asset routes: /api/country.
# The legacy-domain redirect (electerm.html5beta.com -> electerm.org) is a
# Cloudflare Page Rule configured at the edge, not in this worker.
#
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "electerm-org"
main = "src/worker.js"
compatibility_date = "2026-06-30"

[assets]
# Static site generated by `npm run b`
directory = "./public"
# Lets the worker fall back to assets for unmatched paths
binding = "ASSETS"
# Serve 404.html with a 404 status for unknown paths (replaces Vercel's rewrite to /api/404)
not_found_handling = "404-page"
# Asset runtime serves files and applies _headers. The worker only runs for
# non-asset routes (legacy redirect, /api/*). Must stay false — see note above.
run_worker_first = false

[observability]
enabled = true
